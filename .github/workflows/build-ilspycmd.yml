name: Build & Release ilspycmd (self-contained)

# 定时检测 icsharpcode/ILSpy 是否有新版本，如果有（或已发布但资产不全），
# 就把其中的命令行工具 ilspycmd 编译成 self-contained（自带 .NET 运行时，
# 目标机器无需安装 dotnet SDK/Runtime）的以下 5 个平台包，并发布到本仓库
# 的 Release：
#   linux-arm64 / linux-musl-arm64 / linux-musl-x64 / linux-x64 / win-x64
#
# Periodically checks icsharpcode/ILSpy for a new version. If found (or an
# existing release is missing assets), builds ilspycmd as a self-contained
# (bundled .NET runtime, no SDK/Runtime needed on the target machine)
# package for the 5 platforms above and publishes them to this repo's
# Releases.
#
# 安全设计要点（本 workflow 会自动编译并执行第三方源码，按"供应链系统"对待）：
#   1. 权限最小化：默认只读，只有 publish job 才有 contents: write
#   2. build job 检出第三方源码时不保留 git 凭据（persist-credentials: false）
#   3. 所有第三方 Action 固定到完整 commit SHA（由 Dependabot 自动提 PR 升级）
#   4. 检测阶段把 tag 解析成 commit SHA，构建阶段直接按 SHA 检出，
#      避免"检测时和构建时 tag 指向不同 commit"
#   5. run 脚本里不直接插值 ${{ }}，统一走环境变量，避免脚本注入
#   6. 发布 SHA256SUMS，并对可原生运行的平台做冒烟测试

on:
  schedule:
    # UTC 时间每天 03:00 检测一次（北京时间 11:00），可按需修改 cron 表达式
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: '强制指定要构建的 ILSpy 版本 tag（例如 v11.0-rc），留空则自动检测上游最新正式版'
        required: false
        default: ''
      include_prerelease:
        description: '自动检测时是否包含预发布版本（rc / preview）'
        type: boolean
        default: false

# 全局默认只读；需要写权限的 job（publish）单独声明
permissions:
  contents: read

# 同一时间只允许一个发布流程运行，防止"定时任务 + 手动触发"并发改同一个 Release。
# cancel-in-progress 必须是 false：发布到一半被取消会留下半成品。
concurrency:
  group: ilspycmd-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: icsharpcode/ILSpy
  # 5 个平台包的 RID 列表，用于校验已发布 Release 的资产是否齐全
  RID_LIST: "linux-arm64 linux-musl-arm64 linux-musl-x64 linux-x64 win-x64"

jobs:
  # ---------------------------------------------------------------------
  # 第 1 步：检测上游版本 -> 解析 commit SHA -> 校验本仓库资产是否齐全
  # ---------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      commit: ${{ steps.detect.outputs.commit }}
      should_build: ${{ steps.detect.outputs.should_build }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      release_url: ${{ steps.detect.outputs.release_url }}
    steps:
      - name: 检测上游版本并校验本仓库资产完整性
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          INCLUDE_PRE: ${{ github.event.inputs.include_prerelease }}
        run: |
          set -euo pipefail

          # 统一的 API 调用封装：HTTP 错误直接失败（-f），网络抖动自动重试，
          # 避免 403/429/5xx 被悄悄吞掉，后面才冒出难懂的 "null" 错误
          gh_api() {
            curl -fsS --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          # ---- A. 确定要构建的 tag ----
          if [ -n "${FORCE_VERSION:-}" ]; then
            # 手动输入的版本号先做格式校验，只允许常见 tag 字符
            if ! printf '%s' "$FORCE_VERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
              echo "force_version 含有非法字符: $FORCE_VERSION" >&2
              exit 1
            fi
            TAG="$FORCE_VERSION"
            echo "手动指定版本: $TAG"
            # 手动指定时也去上游查这个 tag 真实的 prerelease 状态，不写死 false
            RELEASE_JSON=$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${TAG}")
          else
            if [ "${INCLUDE_PRE:-false}" = "true" ]; then
              # 只排除 draft，其余（含 prerelease）按发布时间倒序取第一个
              RELEASE_JSON=$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=100" \
                | jq '[.[] | select(.draft==false)] | sort_by(.published_at) | reverse | .[0]')
            else
              # /releases/latest 的官方语义：最新的非 draft、非 prerelease
              RELEASE_JSON=$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")
            fi
          fi

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          PRERELEASE=$(echo "$RELEASE_JSON" | jq -r '.prerelease')
          RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url')
          echo "上游版本: $TAG (prerelease=$PRERELEASE)"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "未能获取到上游版本号" >&2
            exit 1
          fi

          # ---- B. tag -> commit SHA ----
          # 后续构建直接按 commit SHA 检出，保证"检测的"和"构建的"是同一份源码
          REF_JSON=$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/git/refs/tags/${TAG}")
          OBJ_TYPE=$(echo "$REF_JSON" | jq -r '.object.type // empty')
          OBJ_SHA=$(echo "$REF_JSON" | jq -r '.object.sha // empty')
          if [ -z "$OBJ_SHA" ]; then
            echo "无法解析 tag ${TAG} 对应的 commit" >&2
            exit 1
          fi
          if [ "$OBJ_TYPE" = "tag" ]; then
            # annotated tag：再解一层拿到真正指向的 commit
            TAG_JSON=$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/git/tags/${OBJ_SHA}")
            COMMIT_SHA=$(echo "$TAG_JSON" | jq -r '.object.sha')
          else
            COMMIT_SHA="$OBJ_SHA"
          fi
          echo "tag ${TAG} -> commit ${COMMIT_SHA}"

          # ---- C. 校验本仓库该版本的 5 个资产是否齐全 ----
          # 不只判断 Release 是否存在：某次构建部分失败后，Release 可能缺文件，
          # 只判断存在性会导致永久跳过
          SHOULD_BUILD=true
          if gh release view "$TAG" --repo "$GH_REPO" --json assets \
              > /tmp/existing-release.json 2>/dev/null; then
            MISSING=false
            for rid in ${RID_LIST}; do
              NAME="ilspycmd-${TAG}-${rid}.zip"
              if ! jq -e --arg n "$NAME" '.assets[]? | select(.name == $n)' \
                  /tmp/existing-release.json > /dev/null; then
                echo "缺少资产: $NAME"
                MISSING=true
              fi
            done
            if [ "$MISSING" = "false" ]; then
              echo "本仓库 release ${TAG} 已存在且 5 个资产齐全，跳过构建"
              SHOULD_BUILD=false
            else
              echo "本仓库 release ${TAG} 存在但资产不全，重新构建补齐"
            fi
          fi

          {
            echo "version=$TAG"
            echo "commit=$COMMIT_SHA"
            echo "should_build=$SHOULD_BUILD"
            echo "prerelease=$PRERELEASE"
            echo "release_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 第 2 步：按 5 个 RID 并行构建 self-contained 包
  #   这个 job 会执行第三方源码（MSBuild / NuGet），所以只给只读权限，
  #   且检出时不保留 git 凭据。
  #   dotnet publish --self-contained 本身是跨平台发布，全部放在 Linux
  #   runner 上即可，不需要 Windows / ARM 机器。
  #   任意一个 RID 失败 -> build job 整体失败 -> publish 不会运行，
  #   天然实现"5 个全部成功才发布"。
  # ---------------------------------------------------------------------
  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-arm64
          - linux-musl-arm64
          - linux-musl-x64
          - linux-x64
          - win-x64
    # 统一通过环境变量传递，脚本里一律用 $VERSION / $COMMIT / $RID，
    # 不在 run 脚本里直接写 ${{ }}（防脚本注入）
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      COMMIT: ${{ needs.check-version.outputs.commit }}
      RID: ${{ matrix.rid }}
    steps:
      - name: 检出 ILSpy 源码（按 commit SHA，不保留凭据）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: icsharpcode/ILSpy
          ref: ${{ needs.check-version.outputs.commit }}
          submodules: false          # 构建 ilspycmd 用不到 ILSpy-Tests 子模块
          persist-credentials: false # 第三方代码不应接触 git 凭据
          path: ilspy-src

      # 不使用 setup-dotnet 的 global-json-file：上游 global.json 的
      # sdk.version 写的是 "11.0.0"，setup-dotnet 较新版本对
      # "非完整版本号 + rollForward" 的组合会直接报错。
      # ILSpy 官方 CI 本身也没有用 global-json-file，而是直接写死
      # dotnet-version + dotnet-quality: preview。
      # 这里的做法：不修改 global.json，只从中读出 major.minor 换算成
      # channel（如 11.0.0 -> 11.0.x），再显式安装——既适配上游，又不硬编码。
      - name: 解析上游要求的 SDK channel
        id: sdkver
        run: |
          set -euo pipefail
          RAW=$(jq -r '.sdk.version // empty' ilspy-src/global.json 2>/dev/null || true)
          if [ -z "$RAW" ]; then
            echo "global.json 未指定 sdk.version，退回安装 latest"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            CHANNEL="$(echo "$RAW" | cut -d. -f1-2).x"
            echo "global.json 指定 sdk.version=${RAW}，换算为 channel=${CHANNEL}"
            echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ steps.sdkver.outputs.channel }}
          # 该 channel 若已 GA，仍会装到最新正式版；
          # 若仍是 preview（如 11.0.x），需要这个开关才能装上
          dotnet-quality: 'preview'

      # 诊断：打印实际生效的 SDK 解析结果（global.json 解析失败会在这里直接暴露）
      - name: 诊断：dotnet --info
        working-directory: ilspy-src
        run: |
          set -euo pipefail
          dotnet --info

      # 如果后续 restore/publish 阶段 dotnet CLI 自己也因 global.json 报
      # "compatible SDK not found"，再启用下面这个兜底（删除 sdk 锁定段，
      # 保留 msbuild-sdks 等其它内容）。目前按官方 CI 的做法判断不需要。
      # - name: 兜底：清除 global.json 的 sdk 锁定段
      #   working-directory: ilspy-src
      #   run: jq 'del(.sdk)' global.json > global.json.tmp && mv global.json.tmp global.json

      - name: 定位 ilspycmd 项目文件
        working-directory: ilspy-src
        run: |
          set -euo pipefail
          # 不写死路径（上游曾把目录从 ICSharpCode.Decompiler.Console
          # 改名为 ICSharpCode.ILSpyCmd），按 ToolCommandName 特征搜索。
          # 0 个或多个候选都直接失败，不再随便取第一个。
          MATCHES=$(grep -rl "<ToolCommandName>ilspycmd" --include="*.csproj" . || true)
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "未找到 ilspycmd 项目文件" >&2
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "找到多个候选项目文件，无法自动确定，请人工检查：" >&2
            printf '%s\n' "$MATCHES" >&2
            exit 1
          fi
          echo "找到项目文件: $MATCHES"
          echo "CSPROJ=$MATCHES" >> "$GITHUB_ENV"

      # Restore：优先遵守上游 packages.lock.json，失败再回退为不锁定。
      #
      # 重要：这里用 -p:RuntimeIdentifier=<rid>（单数），而不是 `dotnet restore -r`。
      #   dotnet restore -r  -> 传给 MSBuild 的是复数 RuntimeIdentifiers
      #   dotnet publish -r  -> 传的是单数 RuntimeIdentifier（本地 bat 用的就是这个）
      # 实测前者会让 ICSharpCode.Decompiler.Generators（netstandard2.0 的
      # Roslyn 源生成器，被 Decompiler 以 Analyzer 方式引用）在 restore 阶段
      # 1ms 内静默失败（MSB4181: RestoreTask returned false but did not log
      # an error）。改成单数后，restore 的语义和 publish 隐式 restore 一致。
      #
      # TreatWarningsAsErrors=false：上游把"警告当错误"设成了全仓库默认，
      # 而我们用的是更新的预览版 SDK，新增警告不应让打包中断。
      - name: Restore
        working-directory: ilspy-src
        run: |
          set -euo pipefail

          restore() {
            dotnet restore "$CSPROJ" \
              -p:RuntimeIdentifier="$RID" \
              -p:TreatWarningsAsErrors=false \
              "$@"
          }

          echo "== 尝试 1：遵守上游 packages.lock.json =="
          if restore; then
            echo "锁定模式 restore 成功"
            exit 0
          fi

          echo "== 尝试 2：RestoreLockedMode=false（该 RID 不在上游 lock 文件里是预期情况）=="
          if restore -p:RestoreLockedMode=false -p:RestoreEnablePackagePruning=false \
              2>&1 | tee restore.log; then
            echo "不锁定模式 restore 成功"
            exit 0
          fi

          # 仍然失败：提取真实错误成注解，并单独 restore 一次 Generators
          # 暴露 NuGet 没有明确报出来的原因（上一次失败的就是它）
          tr -d '\r' < restore.log | grep -E "error " | sort -u | head -20 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          echo "::group::诊断：单独 restore ICSharpCode.Decompiler.Generators"
          dotnet restore ICSharpCode.Decompiler.Generators/ICSharpCode.Decompiler.Generators.csproj \
            -p:RuntimeIdentifier="$RID" -p:RestoreLockedMode=false -v:n 2>&1 | tail -60 || true
          echo "::endgroup::"
          exit 1

      # DebugType=none / DebugSymbols=false：从源头不生成托管 .pdb
      - name: Publish self-contained
        working-directory: ilspy-src
        run: |
          set -euo pipefail
          dotnet publish "$CSPROJ" \
            -c Release \
            -r "$RID" \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=false \
            -p:TreatWarningsAsErrors=false \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "../out/${RID}"

      # 清理编译参数关不掉的"垃圾"：
      #   *.dbg       Linux 下 native 运行时组件的独立调试符号（通常体积最大）
      #   createdump  Linux/macOS 下生成崩溃 core dump 的小工具，CLI 用不上
      #   *.pdb       以防个别第三方依赖自带预编译 pdb
      #   *.xml       API 文档注释
      # 清理后会再跑一遍冒烟测试，确认删除没有影响运行。
      - name: 清理调试符号与无用文件
        run: |
          set -euo pipefail
          OUT_DIR="out/${RID}"
          echo "清理前体积:"; du -sh "$OUT_DIR"
          echo "将要删除的文件："
          find "$OUT_DIR" -type f \( -name "*.dbg" -o -name "*.pdb" -o -name "*.xml" -o -name "createdump" \) -print
          find "$OUT_DIR" -type f \( -name "*.dbg" -o -name "*.pdb" -o -name "*.xml" -o -name "createdump" \) -delete
          echo "清理后体积:"; du -sh "$OUT_DIR"

      # 公开分发二进制时，把上游的 License / 第三方声明一并放进压缩包
      - name: 复制 License / 第三方声明
        run: |
          set -euo pipefail
          FOUND=0
          for f in LICENSE LICENSE.txt LICENSE.md NOTICE NOTICE.txt \
                   THIRD-PARTY-NOTICES.txt THIRD-PARTY-NOTICES.md; do
            if [ -f "ilspy-src/$f" ]; then
              cp "ilspy-src/$f" "out/${RID}/"
              echo "已复制 $f"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::上游源码根目录没有找到 LICENSE / NOTICE 文件，请人工确认"
          fi

      # 冒烟测试：构建成功 != 能运行。
      # 只有 linux-x64（runner 原生）和 linux-musl-x64（Alpine 容器）能在
      # 当前 runner 上验证；arm64 与 win-x64 跨架构/跨平台无法在此执行，
      # 属于已知验证缺口。
      - name: 冒烟测试（linux-x64，原生运行）
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          chmod +x "out/${RID}/ilspycmd"
          "out/${RID}/ilspycmd" --version

      - name: 冒烟测试（linux-musl-x64，Alpine 容器内运行）
        if: matrix.rid == 'linux-musl-x64'
        run: |
          set -euo pipefail
          chmod +x "out/${RID}/ilspycmd"
          docker run --rm -v "$PWD/out/${RID}:/app:ro" alpine:3 /app/ilspycmd --version

      - name: 打包 zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cd "out/${RID}"
          zip -r -9 -q "../../dist/ilspycmd-${VERSION}-${RID}.zip" .
          cd ../..
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ilspycmd-${{ matrix.rid }}
          path: dist/*.zip
          retention-days: 14         # 保留久一点，方便发布失败后排查
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 第 3 步：汇总所有产物，生成 SHA256SUMS，发布/更新到本仓库 Release
  #   只有这个 job 拥有 contents: write，且不检出、不执行任何第三方源码。
  # ---------------------------------------------------------------------
  publish:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: ilspycmd-*
          merge-multiple: true

      - name: 生成 SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: "ilspycmd ${{ needs.check-version.outputs.version }} (self-contained)"
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          body: |
            ## 简介 / Overview

            自动构建自 [icsharpcode/ILSpy@${{ needs.check-version.outputs.version }}](${{ needs.check-version.outputs.release_url }})（commit `${{ needs.check-version.outputs.commit }}`）的 `ilspycmd` self-contained 版本。压缩包内已包含对应平台的 .NET 运行时，解压即可直接运行，**目标机器无需安装 .NET SDK/Runtime**。已移除调试符号（`*.pdb` / `*.dbg`）、`createdump` 及 API 文档注释（`*.xml`）等对最终用户无用的文件，仅保留运行所需内容。

            Self-contained build of `ilspycmd`, automatically compiled from [icsharpcode/ILSpy@${{ needs.check-version.outputs.version }}](${{ needs.check-version.outputs.release_url }}) at commit `${{ needs.check-version.outputs.commit }}`. Each archive bundles its own .NET runtime — **no .NET SDK/Runtime installation is required** on the target machine. Debug symbols (`*.pdb` / `*.dbg`), the `createdump` crash-dump helper, and API doc-comment `*.xml` files have been stripped, leaving only what's needed to run.

            本 Release 由 GitHub Actions 定时自动生成，非 ILSpy 官方发布。
            This release is generated automatically on a schedule by GitHub Actions and is **not** an official ILSpy release.

            构建记录 / Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## 下载 / Downloads

            | 平台 / Platform | 文件 / File |
            | --- | --- |
            | Linux x64 (glibc，如 Ubuntu/Debian/CentOS) | `ilspycmd-${{ needs.check-version.outputs.version }}-linux-x64.zip` |
            | Linux arm64 (glibc) | `ilspycmd-${{ needs.check-version.outputs.version }}-linux-arm64.zip` |
            | Linux x64 (musl，如 Alpine) | `ilspycmd-${{ needs.check-version.outputs.version }}-linux-musl-x64.zip` |
            | Linux arm64 (musl) | `ilspycmd-${{ needs.check-version.outputs.version }}-linux-musl-arm64.zip` |
            | Windows x64 | `ilspycmd-${{ needs.check-version.outputs.version }}-win-x64.zip` |

            下载后请用 `SHA256SUMS` 核对文件完整性。
            Please verify downloads against the checksums in `SHA256SUMS`.

