# ============================================================================
# 临时探针：验证 ubuntu-24.04-arm 原生 runner 能否构建 linux-musl-arm64
#
# 【目的】
# 主 workflow 目前所有 RID 都在 x86_64 runner 上跑，arm64 产物依赖
# qemu-user 模拟执行，实测「真机验证」单步耗时 296 秒、整条腿 8 分钟，
# 占总耗时约 66% —— 纯粹是模拟成本。
#
# GitHub 已提供免费原生 arm64 runner（标签 ubuntu-24.04-arm，4 vCPU /16GB，
# 镜像预装 Docker 28.0.4 Server 原生 arm64）。本探针用于确认：
#   1. arm runner 上 actions/setup-dotnet 能否装好 8/9/10/11 四套 SDK
#   2. dotnet publish -r linux-musl-arm64 能否成功
#   3. docker run alpine:3（不带 --platform）能否取到 aarch64 库
#   4. 产物架构断言与 L1/L2/L3 三级验证能否通过、耗时多少
#
# 【安全边界 —— 本探针绝不做什么】
#   -不创建/ 修改 / 删除任何 Release
#   - 不写latest.json、不碰 SHA256SUMS
#   - 不上传任何 artifact（除了本地产物的临时校验）
#   - 仅 workflow_dispatch 手动触发
#
# 也就是说：即使本探针完全跑通并被误合并，也不会影响任何对外产物。
# 验证通过后需人工把结论回填到 build-ilspycmd.yml，本文件即可删除。
# ============================================================================
name: Probe linux-musl-arm64 on native ARM runner

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '要验证的上游 ILSpy tag（留空则自动取上游最新正式版）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    name: probe on arm64 runner
    # 【关键】原生 arm64 runner。GitHub 文档：public 仓库免费。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      INPUT_TAG: ${{ github.event.inputs.upstream_tag }}

    steps:
      # -------------------------------------------------------------------
      - name: 探针自检（架构 / Docker / 工具链）
        run: |
          set -uo pipefail
          echo "::group::探针自检"
          echo "uname -m   = $(uname -m)"
          echo "uname -r   = $(uname -r)"
          echo "nproc      = $(nproc)"
          # 【工具存在性用 command -v 判，不用 `cmd --version | ...`】
          # 两个原因：
          #  1) `cmd ... | sed -n 1p || echo 【缺失】` 里的 `||` 是死代码——
          #     管道最后一个命令是 sed，退出码恒为 0，`||` 分支永不执行。
          #     工具真的缺失时日志显示空白，而不是【缺失】。
          #  2) 不能改回 `| head -1`：head 读够就关闭管道，工具收到 SIGPIPE
          #     返回 141，配合 pipefail 反而会把"工具存在"误报成"缺失"。
          # command -v 两个问题都不沾。
          for TOOL in docker jq 7z readelf patchelf; do
            if command -v "$TOOL" >/dev/null 2>&1; then
              echo "$TOOL= $(command -v "$TOOL")"
            else
              echo "$TOOL     = 【缺失】"
            fi
          done

          # 架构必须是 aarch64。若不是，本探针的全部前提不成立，直接失败——
          # 比"跑出一个看似成功的结果"更诚实。
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "::error::预期 aarch64，实际 $(uname -m)。ubuntu-24.04-arm 标签可能未生效。"
            exit 1
          fi
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::arm runner 上没有 docker，无法验证容器路径。"
            exit 1
          fi
          # patchelf / readelf 是后续两个核心断言步骤的硬依赖：RPATH 注入依赖
          # patchelf，架构断言与"筛出真正需要 libstdc++/libgcc_s 的 ELF"依赖
          # readelf。缺任何一个，本探针最核心的结论都无法给出。
          # 为什么要在这里就硬失败而不是等到用的时候：ubuntu-24.04-arm 是需要
          # 排队的稀缺资源，排在第 1 步就发现工具没装，和排到第 5 步才发现，
          # 后者等于白白浪费一次排队机会。宁可现在失败。
          for TOOL in readelf patchelf; do
            if ! command -v "$TOOL" >/dev/null 2>&1; then
              echo "::error::缺少 $TOOL：原生 arm runner 镜像未预装该工具，探针无法给出架构/RPATH 结论。"
              exit 1
            fi
          done
          echo "::endgroup::"
          echo "PROBE_ENV_OK"

      # -------------------------------------------------------------------
      # 【核心验证点 1】Docker 能否原生跑 aarch64 容器（不需要 --platform，
      # 也不需要 qemu）。这直接对应主 workflow 里耗时最大的那一步。
      - name: 验证 Docker 原生运行 aarch64 容器（无 qemu）
        run: |
          set -uo pipefail
          echo "::group::Docker 原生 arm64 容器验证"
          T0=$(date +%s)
          # 注意：这里刻意**不带** --platform。原生 arm runner 上不带才是真原生；
          # 若带 --platform 反而可能掩盖"实际在模拟"的假象。
          OUT=$(docker run --rm alpine:3 /bin/sh -c 'uname -m; cat /etc/apk/arch' 2>&1)
          RC=$?
          T1=$(date +%s)
          echo "退出码: $RC"
          echo "输出:"
          echo "$OUT" | sed 's/^/  /'
          echo "耗时: $((T1-T0)) 秒"
          if [ $RC -ne 0 ]; then
            echo "::error::arm runner 上 docker run alpine:3 失败"
            echo "$OUT"
            exit 1
          fi
          if ! echo "$OUT" | grep -qi 'aarch64'; then
            echo "::error::容器架构不是 aarch64，runner 可能不是真 arm"
            exit 1
          fi
          echo "::endgroup::"
          echo "PROBE_DOCKER_NATIVE_OK"

      # -------------------------------------------------------------------
      - name: 解析上游版本与源码地址
        id: src
        run: |
          set -euo pipefail
          gh_api() {
            curl -fsS --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "$1"
          }
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh_api "https://api.github.com/repos/icsharpcode/ILSpy/releases/latest" \
                  | jq -r '.tag_name')
          fi
          echo "上游 tag: $TAG"
          # 解析出该 tag 的 commit SHA，锁定源码，避免构建期间上游变动
          SHA=$(gh_api "https://api.github.com/repos/icsharpcode/ILSpy/git/ref/tags/${TAG}" \
                | jq -r '.object.type + " " + .object.sha')
          TYPE=$(echo "$SHA" | cut -d" " -f1)
          COMMIT=$(echo "$SHA" | cut -d" " -f2)
          if [ "$TYPE" = "tag" ]; then
            # annotated tag 需要再解一层拿到真正的 commit
            COMMIT=$(gh_api "https://api.github.com/repos/icsharpcode/ILSpy/git/tags/${COMMIT}" \
                     | jq -r '.object.sha')
          fi
          echo "commit: $COMMIT"
          {
            echo "tag=$TAG"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"
          # tag 来自上游 API / 手动输入，属于不可信内容。
          # 按主 workflow 的约定（安全加固 4），run 脚本里不直接写 ${{ }}，
          # 统一走环境变量，避免把上游字符串直接拼进 shell 源码。
          echo "PROBE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PROBE_SRC_OK"

      # -------------------------------------------------------------------
      - name: 检出 ILSpy 源码（按 commit SHA）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: icsharpcode/ILSpy
          ref: ${{ steps.src.outputs.commit }}
          path: ilspy-src
          persist-credentials: false

      # -------------------------------------------------------------------
      - name: 清理 global.json 的 SDK 锁定（与主 workflow 配方一致）
        run: |
          set -euo pipefail
          GJ="ilspy-src/global.json"
          if [ -f "$GJ" ]; then
            jq 'del(.sdk)' "$GJ" > "$GJ.tmp" && mv "$GJ.tmp" "$GJ"
            echo "已删除 global.json 的 .sdk 段"
          else
            echo "::warning::未找到 $GJ，跳过"
          fi

      # -------------------------------------------------------------------
      # 【核心验证点 2】四套 .NET SDK 能否在 arm64 上装起来。
      # 这是切换前最大的未知项——主 workflow 依赖 8/9/10/11 四套，
      # 任何一套装不上，整条腿都会挂。
      - name: 安装 .NET SDK（四套）
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: |
            ilspy-src/**/*.csproj
            ilspy-src/**/packages.lock.json

      - name: 校验 SDK 清单
        id: sdk
        run: |
          set -uo pipefail
          echo "::group::已安装的 SDK"
          dotnet --list-sdks | sed 's/^/  /'
          echo "::endgroup::"
          # 【断言必须按 major 去重，而不是数行数】
          # 原写法 `grep -cE '^8\.|^9\.|^10\.|^11\.'` 数的是"行数"，
          # 而它声称验证的是"8/9/10/11 **四套**"。这两件事不等价：
          # 实测反例 `8.0.404 / 8.0.303 / 9.0.301 / 9.0.203`（只有 8、9
          # 两个 major）会让行数恰好等于 4 而**被放行**。
          # 后果是后面拿"4 套 SDK"当结论，但机器上根本没有 10 和 11——
          # 而主 workflow 的 recipe 正是依赖 8/9/10/11 四套。
          # 探针谎报 SDK 清单 = 绿灯失去参考价值。
          SDK_LIST=$(dotnet --list-sdks | awk '{print $1}' | cut -d. -f1 | sort -u)
          echo "已安装 SDK 的 major 集合: $(printf '%s' "$SDK_LIST" | tr '\n' ' ')"
          MISSING=""
          for MAJOR in 8 9 10 11; do
            if ! printf '%s\n' "$SDK_LIST" | grep -qx "$MAJOR"; then
              MISSING="$MISSING $MAJOR"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少以下 major 的 SDK:${MISSING}"
            echo "::error::期望 8/9/10/11 各至少一套（对应主 workflow 的四套配方）"
            echo "::error::实际安装: $(dotnet --list-sdks | tr '\n' ' ')"
            echo "::error::arm runner 上 SDK 安装有问题，不能切换。"
            exit 1
          fi
          echo "8/9/10/11 四个 major 均已就位"
          # 把真实值写出去，供最后的汇总步骤引用（见「探针结论汇总」的说明）
          echo "majors=$(printf '%s' "$SDK_LIST" | tr '\n' ',')" >> "$GITHUB_OUTPUT"
          echo "PROBE_SDK_OK"

      # -------------------------------------------------------------------
      - name: 定位 ilspycmd 项目文件
        # 【为什么用 working-directory 而不是相对路径前缀】
        # 主 workflow 的定位步骤用的是 `working-directory: ilspy-src` +
        # `grep ... .`，输出的 MATCHES 是**不带 ilspy-src/ 前缀**的相对路径，
        # 后续步骤也都在同一个 working-directory 里消费它。
        # 这里刻意逐字对齐：若改用 `grep ... ilspy-src`，MATCHES 会带上
        # `ilspy-src/` 前缀，再配 working-directory 就会变成
        # `ilspy-src/ilspy-src/xxx.csproj` 而找不到文件。
        # 与主 workflow 保持同一套路径语义，日后把逻辑搬回去不会有意外。
        working-directory: ilspy-src
        run: |
          set -euo pipefail
          # 【与主workflow build-ilspycmd.yml 第 782 行完全一致的定位方式】
          #
          # 不写死路径：上游曾把目录从 ICSharpCode.Decompiler.Console 改名为
          # ICSharpCode.ILSpyCmd，所以按 <ToolCommandName>ilspycmd 这个特征搜索。
          #
          # 【为什么不能用 grep 'OutputType.*Exe' | grep -i ILSpyCmd | head -1】
          # 那是"匹配任意 Exe 项目 + 名字里带 ILSpyCmd"，会命中
          # ICSharpCode.ILSpy（ILSpy 图形主程序集，同样是 Exe）之类的无关项目。
          # 一旦选错项目，publish 出来的东西根本不是 ilspycmd，
          # 而后面 L3 反编译验证照样可能"跑通了"——给出误导性绿灯，
          # 这比直接失败危险得多。因此这里和主 workflow 一样做严格加固：
          # 0 个候选失败、多个候选也失败并列出全部，绝不随便取第一个。
          MATCHES=$(grep -rl "<ToolCommandName>ilspycmd" --include="*.csproj" . || true)
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到 ilspycmd 项目文件（特征 <ToolCommandName>ilspycmd）"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::找到多个候选项目文件，无法唯一确定，拒绝随便取第一个："
            printf '%s\n' "$MATCHES"
            exit 1
          fi
          echo "项目文件: $MATCHES"
          # 【安全加固】与主 workflow 一致：统一通过环境变量传递，
          # run 脚本里一律用 $CSPROJ，不直接写 ${{ }}（防脚本注入）。
          # 注意 CSPROJ 不带 ilspy-src/ 前缀——它会在下面两个步骤的
          # working-directory: ilspy-src 里被消费。
          echo "CSPROJ=$MATCHES" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # 【P0】Restore 必须带重试 —— 这不是多余的防御，是必需的
      #
      # 【背景：主 workflow 记录的一个真实 flake】
      # 主 workflow 第 612-619 行的注释完整记录过一次排查：同一个 commit、
      # 同一套 SDK、逐字相同的 restore 命令，在 diag2/diag3/diag5 中连续
      # EXIT=0，却在 diag4 中连续 3 次 EXIT=1；同一个 workflow 里 5 个并发
      # job 也时好时坏。结论原话是"不能靠换配方解决，只能靠重试"。
      # 主 workflow 第 848-906 行据此实现了 MAX_ATTEMPTS=6 的重试循环。
      #
      # 【为什么探针必须有同样的重试 —— 这是本条最要紧的理由】
      # 探针只有一次排队机会。**假红的代价和假绿一样大**：
      # 若不带重试，撞上这个已知 flake 时探针会红，而人类无法区分
      # 「原生 arm 真不行」和「撞上了那个已知 flake」——后者会得出
      # 完全反向的结论，让一次已经排上队的、代价高昂的验证白白浪费。
      # 探针的价值恰恰在于它给出的结论可信；一个会因已知 flake 而随机
      # 变色的探针，是不可信的探针。所以这里照抄主 workflow 的重试结构。
      #
      # 参数说明：
      #   -p:RestoreEnablePackagePruning=false —— 主 workflow 也在传。
      #     裁剪（pruning）会跳过"用不到的包"，而 lock 文件里没有
      #     linux-musl-arm64 这一 RID 的段，裁剪逻辑与锁文件组合时
      #     是已知的偶发故障来源。关掉它以保证确定性。
      #   失败时清 obj/ + NuGet http 缓存 + 全局包缓存：
      #     只重试不清理等于用同一份坏状态再撞一次。
      #   sleep $((ATTEMPT * 5)) 递增退避：给 NuGet 上游一点恢复时间。
      - name: Restore（失败自动重试）
        working-directory: ilspy-src
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=6
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=====还原尝试 $ATTEMPT / $MAX_ATTEMPTS ====="
            if dotnet restore "$CSPROJ" \
                -r linux-musl-arm64 \
                -p:RestoreLockedMode=false \
                -p:RestoreEnablePackagePruning=false; then
              echo "还原成功（第 $ATTEMPT 次尝试）"
              exit 0
            fi
            echo "::warning::第 $ATTEMPT 次还原失败（Generators 的 MSB4181 偶发故障）"
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::还原重试 $MAX_ATTEMPTS 次仍失败"
              echo "::group::最后一次失败的相关项目状态"
              find . -type d -name obj -prune -exec ls -la {} + 2>/dev/null | head -40 || true
              echo "::endgroup::"
              exit 1
            fi
            # 彻底清理：obj/ + NuGet http 缓存 + 全局包缓存
            find . -type d -name obj -prune -exec rm -rf {} + 2>/dev/null || true
            dotnet nuget locals http-cache --clear 2>/dev/null || true
            dotnet nuget locals global-packages --clear 2>/dev/null || true
            ATTEMPT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 5))
          done
          exit 1

      # -------------------------------------------------------------------
      # 【核心验证点 3】能否 publish 出 linux-musl-arm64 的 self-contained 产物
      #
      # 【P0】三个 -p 参数必须与主 workflow 逐字一致，缺一个探针就白跑：
      #   -p:PublishSingleFile=false —— 最关键。若默认开启单文件发布，
      #     产物目录形态（一个巨型可执行文件 vs 几十个 .so）会与主 workflow
      #     完全不同，后面"RPATH 循环"和"架构断言 OK >= 3"两处全走样；
      #     反过来若碰巧默认关闭，探针绿灯也推不出主 workflow 绿灯——
      #     因为两者跑的不是同一个配方。探针的意义是给主 workflow 探路，
      #     配方不一致，绿灯就没有参考价值。
      #   -p:DebugType=none / -p:DebugSymbols=false —— 从源头不生成托管 .pdb，
      #     比发布后再删更干净。少这一步，产物目录里会多出 .pdb，
      #     同样是"探针跑的配方 ≠ 主 workflow 跑的配方"。
      - name: Publish self-contained
        working-directory: ilspy-src
        run: |
          set -euo pipefail
          T0=$(date +%s)
          dotnet publish "$CSPROJ" \
            -c Release \
            -r linux-musl-arm64 \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=false \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "../out/linux-musl-arm64"
          echo "publish 耗时: $(( $(date +%s) - T0 )) 秒"
          # 用 sed -n '1,20p' 而不是 `| head -20`：head 读够就关闭管道，
          # 上游 ls 会收到 SIGPIPE 返回 141，本步骤是 set -euo pipefail，
          # 目录文件一多就会把"publish 成功"误判成失败。
          ls ../out/linux-musl-arm64/ | sed -n '1,20p' | sed 's/^/  /'

      - name: 清理调试符号
        run: |
          set -uo pipefail
          find out/linux-musl-arm64 \
            \( -name '*.pdb' -o -name '*.dbg' -o -name '*.xml' -o -name 'createdump' \) \
            -delete 2>/dev/null
          du -sh out/linux-musl-arm64

      # -------------------------------------------------------------------
      # 【核心验证点 4】GCC 运行库能否取到 aarch64 版本。
      # 这一步在主 workflow 里是 docker run --platform linux/arm64；
      # 原生 runner 上应改为不带 --platform。若这里取到的还是 x86_64，
      # 说明哪里错了——这正是最初那个 bug 的根源，必须盯紧。
      - name: 取 aarch64 的 GCC 运行库并注入 RPATH
        id: libs
        run: |
          set -euo pipefail
          OUT_DIR="out/linux-musl-arm64"

          echo "::group::从 Alpine 取 libstdc++ / libgcc"
          # 刻意不带 --platform：原生 arm runner 上这就是原生 aarch64
          #
          # 【关键】apk 清单必须写进文件，不能只打到 stdout。
          # stdout 只进日志，宿主的断言脚本读不到；而下游宿主要靠这个文件
          # 解析出「取到的库到底是什么架构」——这正是整个探针最核心的断言。
          # 对齐主 workflow build-ilspycmd.yml 第 1507 行的做法。
          docker run --rm -v "$PWD/${OUT_DIR}:/app" alpine:3 /bin/sh -c '
            set -e
            apk add --no-cache libstdc++ libgcc >/dev/null

            # 真实文件（-L 解引用）+ apk 清单，缺一不可。
            # apk list -I 的输出形如"包名-版本 架构 ..."，第 2 个字段就是架构，
            # 宿主侧 awk 就是取这一列。
            cp -L /usr/lib/libstdc++.so.6 /app/libstdc++.so.6
            cp -L /usr/lib/libgcc_s.so.1  /app/libgcc_s.so.1
            apk list -I libstdc++ libgcc > /app/GCC-RUNTIME-LIBRARIES.txt

            # 再把取包环境本身的架构追加进清单，作为"取包环境正确"的独立证据。
            # 分段标记让宿主能无歧义地只解析 apk 那一段——
            # 下面的环境信息绝不能被误当成包架构（这是主 workflow 踩过的坑）。
            {
              echo "Container environment (do not parse as package arch)"
              echo "Fetched-from: alpine:3 (no --platform, native runner)"
              echo "Container uname -m      : $(uname -m)"
              echo "Container /etc/apk/arch : $(cat /etc/apk/arch 2>/dev/null || echo unknown)"
            } >> /app/GCC-RUNTIME-LIBRARIES.txt
          '
          echo "::endgroup::"

          echo "::group::注入 RPATH=\$ORIGIN"
          # 用 readelf 筛出真正需要这两个库的 ELF（含带版本后缀的 .so.6/.so.1）
          #
          # 【glob 必须是 *.so，不能是 *.so* —— 与主 workflow 第 1790 行一致】
          # *.so* 会额外匹配到 libstdc++.so.6 和 libgcc_s.so.1，而这两个文件
          # 是下面那个 docker 容器以 **root** 身份 cp 进 bind mount 的，
          # 宿主 runner 用户对它们**没有写权限**。Alpine 的 libstdc++.so.6
          # 普遍声明了 NEEDED libgcc_s，一旦命中就会进patchelf 分支，
          # 而 patchelf 需要写文件 → 权限不足 → 非 0 退出 →
          # 本步骤硬失败 → 误判成"原生 arm 跑不通"。
          # 那种失败是假的：主 workflow 用 *.so 恰好绕开了这个问题。
          # （注意：下面"架构断言"那一步的循环**应该**保留 *.so*，
          #  因为那里需要覆盖 .so.6/.so.1 后缀，且只读不写。两处不要一起改。）
          #
          # patchelf 的存在性已在「探针自检」里硬失败过了；这里再挡一道，
          # 是为了让失败点落在真正调用它的这一步，日志里一眼能看出是缺工具
          # 而不是 RPATH 注入本身有问题。
          if ! command -v patchelf >/dev/null 2>&1; then
            echo "::error::patchelf 缺失，无法注入 RPATH"
            exit 1
          fi
          CNT=0
          for f in "$OUT_DIR"/ilspycmd "$OUT_DIR"/*.so; do
            [ -f "$f" ] || continue
            if readelf -d "$f" 2>/dev/null | grep -qE 'NEEDED.*(libstdc\+\+|libgcc_s)'; then
              patchelf --set-rpath '$ORIGIN' "$f" || { echo "::error::patchelf 失败: $f"; exit 1; }
              CNT=$((CNT+1))
            fi
          done
          echo "已注入 $CNT 个文件"
          # 计数必须 > 0。若为 0，说明要么没匹配到任何依赖方、要么
          # libstdc++/libgcc_s 根本没被拷进来——两种都是失败，
          # 绝不能"注入 0 个文件"然后报绿。
          if [ "$CNT" -lt 1 ]; then
            echo "::error::没有任何 ELF 被注入 RPATH（匹配到 $CNT 个）。"
            echo "::error::要么 libstdc++/libgcc_s 没取到，要么 readelf 匹配逻辑失效。"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::清单的架构断言"
          # -----------------------------------------------------------------
          # 【本探针最核心的断言】解析 apk 清单，确认取到的库架构恰好是 aarch64
          #
          # 背景：这正是最初那个 bug 的根源——发布出去的包里它是 x86_64。
          # 探针的全部意义就是确认"在原生 arm runner 上不带 --platform
          # 拿到的确实是 aarch64 库"，所以这里必须给出肯定结论，不能空转。
          #
          # 为什么用分段标记而不是简单 grep：apk 输出下面还跟着容器环境信息
          # （Container uname -m: aarch64 等）。若直接对整个文件取第 2 列，
          # "Container uname -m : aarch64" 这行的第 2 列会混进架构集合，
          # 造成"解析出的架构不唯一"或干脆解析出错误值。
          # awk 在标记行处直接 exit，因此标记行本身及其之后的内容都不参与解析。
          #
          # 这里不能用 sed -n "1,/marker/p"：那个范围右端是闭区间，
          # 会把标记行本身交给 awk，而标记行第 2 列是 "Container"/"(do"
          # 之类的字面量，同样会污染架构集合。
          # -----------------------------------------------------------------
          MANIFEST="${OUT_DIR}/GCC-RUNTIME-LIBRARIES.txt"
          MARKER='Container environment (do not parse as package arch)'
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::GCC-RUNTIME-LIBRARIES.txt 缺失或为空，无法确认库架构"
            exit 1
          fi
          if ! grep -qxF -- "$MARKER" "$MANIFEST"; then
            echo "::error::清单缺少分段标记 ${MARKER}"
            cat "$MANIFEST"
            exit 1
          fi
          PKG_ARCHES=$(awk -v m="$MARKER" 'index($0, m) == 1 { exit } NF { print $2 }' \
            "$MANIFEST" | sort -u)
          echo "apk 清单声明的库架构: ${PKG_ARCHES}"
          if [ -z "$PKG_ARCHES" ]; then
            echo "::error::无法从 apk 清单解析出包架构（清单里没有可解析的 apk 行）"
            cat "$MANIFEST"
            exit 1
          fi
          if [ "$(printf '%s\n' "$PKG_ARCHES" | wc -l)" -ne 1 ]; then
            echo "::error::libstdc++ 与 libgcc 架构不一致，拒绝继续:"
            printf '%s\n' "$PKG_ARCHES"
            cat "$MANIFEST"
            exit 1
          fi
          # 【关键断言】必须恰好是 aarch64。
          # 只校验"行数为 1"是不够的——如果 apk 清单里写的是 x86_64，
          # 行数同样为 1，断言会空转通过、探针显示绿灯，
          # 而这恰恰是探针要抓的那个 bug。所以这里比对的是架构字面量本身。
          GCC_ARCH=$(printf '%s\n' "$PKG_ARCHES" | head -n 1)
          if [ "$GCC_ARCH" != "aarch64" ]; then
            echo "::error::apk 清单声明的架构是 '${GCC_ARCH}'，不是 aarch64。"
            echo "::error::说明不带 --platform 在这个 runner 上并没有拿到原生 arm 库——不能切换。"
            cat "$MANIFEST"
            exit 1
          fi
          echo "断言通过: apk 清单声明的库架构 == aarch64"
          # 库文件本身也要看一眼：清单说是 aarch64 不等于文件真是 aarch64。
          # 这里对刚拷进来的两个 .so 直接读 ELF 头，做第二重独立确认。
          for LIB in libstdc++.so.6 libgcc_s.so.1; do
            if [ ! -f "${OUT_DIR}/${LIB}" ]; then
              echo "::error::${LIB} 未被拷入产物目录"
              exit 1
            fi
            M=$(readelf -h "${OUT_DIR}/${LIB}" 2>/dev/null \
                | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            if [ "$M" != "AArch64" ]; then
              echo "::error::${LIB} 的 ELF Machine='${M}'，期望 'AArch64'"
              exit 1
            fi
            echo "  OK  ${LIB} (${M})"
          done
          # 把真实值写出去供汇总步骤引用
          echo "rpath_count=$CNT" >> "$GITHUB_OUTPUT"
          echo "gcc_arch=$GCC_ARCH" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          echo "PROBE_LIBS_OK"

      # -------------------------------------------------------------------
      # 【核心验证点 5】架构断言：包内每个 ELF 都必须是 AArch64。
      # 这一步直接对应最初那个 bug 的防线，务必确认它能真正拦住错架构。
      - name: 架构断言（所有 ELF 必须是 AArch64）
        id: arch
        run: |
          set -uo pipefail
          OUT_DIR="out/linux-musl-arm64"
          EXPECTED="AArch64"
          OK=0; BAD=0
          echo "::group::逐文件校验 ELF 架构"
          for f in "$OUT_DIR"/ilspycmd "$OUT_DIR"/*.so*; do
            [ -f "$f" ] || continue
            B=$(basename "$f")
            M=$(readelf -h "$f" 2>/dev/null | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            if [ -z "$M" ]; then
              echo "  ::error::$B readelf 解析失败"; BAD=$((BAD+1)); continue
            fi
            if [ "$M" != "$EXPECTED" ]; then
              echo "  ::error::$B 架构错配! Machine='$M' 期望 '$EXPECTED'"; BAD=$((BAD+1)); continue
            fi
            echo "  OK  $B  ($M)"; OK=$((OK+1))
          done
          echo "::endgroup::"
          echo "共校验 $OK 个 ELF，错配 $BAD 个"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::存在错架构文件——不能切换到原生 arm runner"
            exit 1
          fi
          if [ "$OK" -lt 3 ]; then
            echo "::error::只校验到 $OK 个 ELF（期望>=3），断言可能未真正生效"
            exit 1
          fi
          # 把真实值写出去供汇总步骤引用
          echo "elf_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "PROBE_ARCH_OK"

      # -------------------------------------------------------------------
      # 【核心验证点 6，最耗时也最关键】三级验证 + 产物内容断言。
      # 主 workflow 这一步在 qemu 下花了 296 秒；这里测原生到底多快，
      # 这是本次切换的核心收益指标。
      - name: 构建冒烟目标程序集
        run: |
          set -euo pipefail
          rm -rf smoke
          mkdir -p smoke
          cat > smoke/Smoke.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <AssemblyName>SmokeTarget</AssemblyName>
              <EnableDefaultCompileItems>true</EnableDefaultCompileItems>
            </PropertyGroup>
          </Project>
          CSPROJ
          cat > smoke/Class1.cs <<'CS'
          using System;
          using System.Collections.Generic;
          namespace SmokeTarget {
              public class Greeter {
                  public string Greet(string name) => "Hello, " + name;
                  public int Sum(int a, int b) { return a + b; }
                  public List<int> Range(int n) {
                      var r = new List<int>();
                      for (int i = 0; i < n; i++) r.Add(i * i);
                      return r;
                  }
              }
              public enum Color { Red, Green, Blue }
          }
          CS

          # 【必须钉住 SDK】此时机器上装了 8/9/10/11 四套 SDK（11 是 preview），
          # 而 smoke/ 目录下没有任何 global.json 约束。dotnet 会挑版本号最高的
          # 那套，也就是 11.0 preview——构建环境不确定，L3 的结论就不可复现。
          # 这里显式钉 8.0.x，让冒烟目标的构建环境是确定的。
          #
          # rollForward: latestFeature —— 允许在 8.0.x 内跨 feature band 前进
          # （8.0.1xx → 8.0.4xx），但绝不跨到 9/10/11。
          # allowPrerelease: false —— 双保险，即使某天 8.0 出了预览版也不选它。
          cat > smoke/global.json <<'GJ'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          GJ

          # 【关键】必须 cd 进 smoke/ 再 build。
          # global.json 的查找是从**当前工作目录**向上逐级找，而不是从
          # .csproj 所在目录找。不 cd 的话，解析起点是仓库根（那里没有
          # global.json），smoke/global.json 会被完全忽略，又回到"随机挑
          # 最高版本 SDK"的老问题。踩过这个坑，所以在这里写清楚。
          cd smoke
          # 回显实际选中的 SDK，证明约束真的生效了（而不是写了文件但没被采纳）。
          SEL_SDK=$(dotnet --version)
          echo "冒烟目标实际使用的 SDK: $SEL_SDK"
          case "$SEL_SDK" in
            8.*) : ;;
            *)
              echo "::error::global.json 未能把冒烟目标钉在 8.0.x，实际选中 ${SEL_SDK}"
              exit 1
              ;;
          esac

          dotnet build Smoke.csproj -c Release -o out --nologo -v q
          cd "$OLDPWD"
          test -f smoke/out/SmokeTarget.dll
          echo "目标程序集: $(wc -c < smoke/out/SmokeTarget.dll) 字节"

      - name: 三级验证 L1/L2/L3 + 产物内容断言（原生 arm，无 qemu）
        id: verify
        run: |
          set -uo pipefail
          OUT_DIR="out/linux-musl-arm64"
          chmod +x "$OUT_DIR/ilspycmd"
          T0=$(date +%s)

          echo "::group::L1 -h"
          # 刻意把输出重定向进文件再检查内容，而不是只看退出码：
          # 退出码 0 但输出为空是最典型的假阳性来源。ilspycmd -h 必然打出
          # 大量用法文本，所以这里同时断言"退出码 0"和"输出非空且含 ilspycmd 字样"。
          # timeout 600：主 workflow 对原生分支用 600、对 qemu 分支用 1800
          # （.NET self-contained 冷启动在模拟下很慢）。这里是原生 arm，
          # 与原生同速，所以取 600。加 timeout 是为了区分"跑得慢"和"挂死"——
          # 不加的话挂死会让整个 job 一直耗到 timeout-minutes 才失败。
          docker run --rm -v "$PWD/${OUT_DIR}:/app:ro" -v "$PWD/smoke/out:/smoke:ro" \
            alpine:3 /bin/sh -c '
              set -e
              [ "$(uname -m)" = "aarch64" ] || { echo "guest不是 aarch64"; exit 1; }
              cd /tmp
              timeout 600 /app/ilspycmd -h > /tmp/l1.txt 2>&1
              # 断言输出真的产生了内容，且确实是 ilspycmd 自己的帮助文本
              [ -s /tmp/l1.txt ] || { echo "::error::L1 输出为空，断言空转"; exit 1; }
              grep -qi "ilspycmd" /tmp/l1.txt \
                || { echo "::error::L1 输出里没有 ilspycmd 字样，可能加载的不是 ilspycmd"; exit 1; }
              echo "L1 退出码 0，输出 $(wc -c < /tmp/l1.txt) 字节"
          '
          RC=$?
          [ $RC -eq 0 ] || { echo "::error::L1 失败"; exit 1; }
          echo "::endgroup::"

          echo "::group::L2 --version"
          # 【断言强度对齐主 workflow run_checks.sh 第 2420-2442 行】
          # 主 workflow 判三件事：退出码 0、输出非空、输出含数字。
          # 探针原来只判退出码 0 —— 那样 ilspycmd 打印空行也算通过，
          # 属于典型的"断言空转"。这里补齐后两项。
          # 注意最后**不做**"版本号 == 上游 tag"的等值断言：不同 tag 的
          # 版本号格式会变，写死比较只会制造假失败；"跑起来的确实是
          # ilspycmd"由 L1 的字样断言和 L3 的反编译断言兜底。
          VER_OUT=$(docker run --rm -v "$PWD/${OUT_DIR}:/app:ro" alpine:3 /bin/sh -c '
              set -e
              [ "$(uname -m)" = "aarch64" ] || { echo "guest不是 aarch64"; exit 1; }
              timeout 600 /app/ilspycmd --version > /tmp/l2.txt 2>&1
              cat /tmp/l2.txt')
          RC=$?
          echo "$VER_OUT" | sed 's/^/  /'
          [ $RC -eq 0 ] || { echo "::error::L2 失败"; exit 1; }
          VERSION_LINE=$(printf '%s' "$VER_OUT" | tr -d '\r' | sed -n '1p')
          if [ -z "$VERSION_LINE" ]; then
            echo "::error::L2 --version 退出码 0 但输出为空"
            exit 1
          fi
          case "$VERSION_LINE" in
            *[0-9]*) : ;;
            *)
              echo "::error::L2 --version 输出不含数字，疑似无效版本信息: '${VERSION_LINE}'"
              exit 1
              ;;
          esac
          echo "L2 版本行: $VERSION_LINE"
          echo "::endgroup::"

          echo "::group::L3 真实反编译 + 产物断言"
          # 【P0】-r /app 不能省。主 workflow 第 2452 行是
          # `--disable-updatecheck -r "$REFDIR" -o . "$TARGET"`，
          # 其中 REFDIR 是产物目录的挂载点（原生/musl 分支就是 /app，
          # 见主 workflow 第 2546/2559 行传给 run_checks.sh 的第二个参数）。
          # -r 让 ilspycmd 用产物目录作引用解析路径，从而能正确解析
          # 随包携带的 System.Private.CoreLib 等程序集。
          # 不带 -r 时解析更容易成功 —— 而"更容易成功"意味着
          # **断言被放宽、假绿概率上升**，方向恰好是最坏的那个。
          # 探针若要比主 workflow 更宽松，那它测出来的"OK"就没有参考价值。
          docker run --rm -v "$PWD/${OUT_DIR}:/app:ro" -v "$PWD/smoke/out:/smoke:ro" \
            alpine:3 /bin/sh -c '
              set -e
              cd /tmp
              timeout 600 /app/ilspycmd --disable-updatecheck -r /app -o /tmp/dec /smoke/SmokeTarget.dll
              echo "--- 生成的 .cs ---"
              ls -la /tmp/dec/
              cat /tmp/dec/*.cs
              echo "--- 特征串断言 ---"
              for MARKER in "class Greeter" "Sum" "enum Color"; do
                if grep -rqF "$MARKER" /tmp/dec/; then
                  echo "  命中: $MARKER"
                else
                  echo "  ::error::未命中: $MARKER"; exit 1
                fi
              done
              echo "VERIFY_RESULT=PASS"
          '
          RC=$?
          T1=$(date +%s)
          [ $RC -eq 0 ] || { echo "::error::L3 失败"; exit 1; }
          echo "::endgroup::"

          echo ""
          echo "=========================================="
          echo "三级验证耗时（原生 arm，无 qemu）: $((T1-T0)) 秒"
          echo "对比：qemu 模拟下主 workflow 同一步约 296 秒"
          echo "=========================================="
          # 把真实耗时写出去供汇总步骤引用
          echo "verify_seconds=$((T1-T0))" >> "$GITHUB_OUTPUT"
          echo "l2_version=$VERSION_LINE" >> "$GITHUB_OUTPUT"
          echo "PROBE_VERIFY_OK"

      # -------------------------------------------------------------------
      # 【为什么这一格读真实值，而不是写死"通过"】
      # 原写法是 6 个硬编码的"通过"字面量，与前面步骤的真实结果**没有任何
      # 数据关联**。它自己不是独立的假绿灯源（step 默认 success() 语义会
      # 拦住前面失败的情况），但它是**假绿灯的放大器**：一旦前面的断言被
      # 绕过或漏判，它会把"只装了 2 个 major"这类残缺结果包装成一份
      # 看起来完整成功的表格——而人往往只读汇总、不翻日志。
      # 既然这份汇总就是给人做切换决策看的最后一屏，就让它显示实测值：
      # 数字对不上时，人能立刻发现前面有步骤没真正生效。
      #
      # 【注意】下面刻意用 ${{ }} ——这是全文件唯一的例外，理由充分：
      # 汇总步骤需要一个"若为空则说明前面被绕过"的醒目信号。
      # 若这里也改走 GITHUB_ENV（前面各步骤用 $GITHUB_OUTPUT 写），
      # 空值会静默变成空字符串并被原样渲染成人眼不易察觉的空格。
      # 这里是纯展示、不参与任何控制流，没有注入面；
      # 而 8 个 outputs 全部来自**探针自己**（dotnet --list-sdks / apk 清单 /
      # readelf / 计时器），不是任何外部不可信输入。
      # 注入防护只针对外部不可信内容，这个例外不削弱它。
      - name: 探针结论汇总
        run: |
          set -uo pipefail
          {
            echo "### 探针结论"
            echo ""
            echo "runner: \`ubuntu-24.04-arm\`（原生 aarch64）"
            echo "上游 tag: \`$PROBE_TAG\`"
            echo ""
            echo "| 验证项 | 实测结果 |"
            echo "|---|---|"
            echo "| 宿主架构 | \`$(uname -m)\` |"
            echo "| Docker 原生 aarch64 容器 | 通过（无 --platform） |"
            echo "| .NET SDK major 集合 | \`${{ steps.sdk.outputs.majors }}\` |"
            echo "| publish linux-musl-arm64 | 通过（配方与主 workflow 一致） |"
            echo "| apk 清单声明的库架构 | \`${{ steps.libs.outputs.gcc_arch }}\` |"
            echo "| 注入 RPATH 的文件数 | \`${{ steps.libs.outputs.rpath_count }}\` |"
            echo "| 通过架构断言的 ELF 数 | \`${{ steps.arch.outputs.elf_ok }}\`（错配 0） |"
            echo "| L2 --version | \`${{ steps.verify.outputs.l2_version }}\` |"
            echo "| L1/L2/L3 耗时 | \`${{ steps.verify.outputs.verify_seconds }}\` 秒（qemu 下约 296 秒） |"
            echo ""
            echo "> 全部数值均为上一步实测写入，非硬编码。若某格为空，"
            echo "说明对应步骤的断言被绕过或未真正生效——请回看日志，勿据此决策。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROBE_ALL_OK——可以按此结论改造 build-ilspycmd.yml"